name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build RPM
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install validation and build tools
        run: >-
          dnf --assumeyes --setopt=install_weak_deps=False install
          ShellCheck
          git
          glibc-langpack-en
          make
          rpm-build
          rpmlint
          systemd

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Bash syntax
        shell: bash
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        run: |
          install -Dpm 0644 config/vidforge.conf.example /etc/vidforge.conf
          shellcheck -x scripts/*.sh

      - name: Validate systemd units
        run: |
          install -Dpm 0755 scripts/vidforge-worker.sh /usr/bin/vidforge-worker
          install -Dpm 0755 scripts/vidforge-encode.sh /usr/bin/vidforge-encode
          install -Dpm 0755 scripts/vidforge-queue.sh /usr/bin/vidforge-queue
          install -Dpm 0755 scripts/vidforge-watch.sh /usr/bin/vidforge-watch
          systemd-analyze verify service/*.service

      - name: Build RPM
        run: make rpm

      - name: Lint RPM packages
        run: rpmlint build/rpmbuild/RPMS/**/*.rpm build/rpmbuild/SRPMS/*.rpm

      - name: Install and verify RPM
        run: |
          dnf --assumeyes --setopt=install_weak_deps=False install \
            build/rpmbuild/RPMS/noarch/vidforge-*.noarch.rpm
          rpm --verify vidforge
