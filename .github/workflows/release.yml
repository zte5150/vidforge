name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install validation tools
        run: >-
          dnf --assumeyes --setopt=install_weak_deps=False install
          bats
          git
          glibc-langpack-en
          make
          rpm-build
          rpmlint
          ShellCheck
          systemd

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          spec_version="$(rpmspec -q --queryformat '%{VERSION}\n' \
            packaging/vidforge.spec | sort --unique)"

          if [[ "$tag_version" != "$spec_version" ]]; then
            printf 'Version mismatch: tag=%s spec=%s\n' \
              "$tag_version" "$spec_version" >&2
            exit 1
          fi

      - name: Validate Bash scripts
        run: |
          install -Dpm 0644 config/vidforge.conf.example /etc/vidforge.conf
          bash -n scripts/*.sh
          shellcheck -x scripts/*.sh

      - name: Run behavioral tests
        run: bats --print-output-on-failure tests

      - name: Validate systemd units
        run: |
          install -Dpm 0755 scripts/vidforge-worker.sh /usr/bin/vidforge-worker
          install -Dpm 0755 scripts/vidforge-encode.sh /usr/bin/vidforge-encode
          install -Dpm 0755 scripts/vidforge-queue.sh /usr/bin/vidforge-queue
          install -Dpm 0755 scripts/vidforge-watch.sh /usr/bin/vidforge-watch
          systemd-analyze verify service/*.service

      - name: Lint RPM packages
        run: |
          make rpm
          rpmlint build/rpmbuild/RPMS/**/*.rpm build/rpmbuild/SRPMS/*.rpm

  build-rpm:
    name: Build RPM (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora-44
            image: fedora:44
            enable_epel: false
          - target: rocky-9
            image: rockylinux:9
            enable_epel: true
          - target: almalinux-9
            image: almalinux:9
            enable_epel: true
    container: ${{ matrix.image }}

    steps:
      - name: Enable EPEL
        if: matrix.enable_epel
        run: dnf --assumeyes install epel-release

      - name: Install build tools
        run: >-
          dnf --assumeyes --setopt=install_weak_deps=False install
          git
          make
          rpm-build
          systemd-rpm-macros

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM packages
        run: make rpm

      - name: Install and verify RPM
        run: |
          dnf --assumeyes --setopt=install_weak_deps=False install \
            build/rpmbuild/RPMS/noarch/vidforge-*.noarch.rpm
          rpm --verify vidforge

      - name: Prepare target assets
        shell: bash
        run: |
          mkdir dist
          for rpm in build/rpmbuild/RPMS/**/*.rpm build/rpmbuild/SRPMS/*.rpm; do
            filename="$(basename "$rpm" .rpm)"
            cp "$rpm" "dist/${filename}.${{ matrix.target }}.rpm"
          done

      - name: Upload target artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vidforge-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build-rpm
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vidforge-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.rpm > SHA256SUMS

      - name: Create or update GitHub release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
              gh release create "$GITHUB_REF_NAME" dist/* \
                --generate-notes \
                --title "$GITHUB_REF_NAME" \
                --verify-tag
          fi
